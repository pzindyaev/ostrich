name: Release

# A GitHub release is produced whenever a tag matching `v*` (e.g. v1.2.3) is
# pushed: static binaries for Linux and macOS (amd64 and arm64), one tar.gz
# each with the LICENSE and docs, checksums.txt, and release notes built
# from the git history.
#
# Privacy: nothing in a release identifies who made the commits. The notes
# come from `git log` with SHA + subject only (scripts/changelog.sh), the
# archives are stamped root/root with the commit date (scripts/package.sh),
# and the binaries carry no local paths (--remap-path-prefix).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The changelog and the version need the tag history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/ostrich --remap-path-prefix=${HOME}=/home
        run: |
          export OSTRICH_VERSION="${GITHUB_REF_NAME#v}"
          export OSTRICH_COMMIT="$(git rev-parse --short HEAD)"
          export OSTRICH_DATE="$(git log -1 --format=%cI)"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          "target/${{ matrix.target }}/release/ostrich" --version || true

      - name: Package
        shell: bash
        run: |
          ./scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/ostrich" dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Checksums and notes
        run: |
          mkdir -p dist
          mv artifacts/*.tar.gz dist/
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ./scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          args=()
          # Pre-release tags such as v1.2.3-rc1 are marked as pre-releases.
          case "$tag" in *-*) args+=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run keeps hand-edited release notes; only the assets are replaced.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file notes.md "${args[@]}"
          fi
