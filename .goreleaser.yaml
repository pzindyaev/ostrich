# GoReleaser configuration — https://goreleaser.com
#
# A GitHub release is produced by the release workflow whenever a tag matching
# `v*` (e.g. v1.2.3) is pushed. Try it locally without publishing anything:
#
#   goreleaser release --snapshot --clean
#
# Privacy: nothing in a release identifies who made the commits. The changelog
# is built from `git log` (not the GitHub API, which appends author handles)
# with a pinned format of SHA + subject only, archives are stamped root/root
# with the commit date rather than the builder's user and clock, and binaries
# are built with -trimpath so no local paths are embedded.
version: 2

project_name: ostrich

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ostrich
    main: .
    binary: ostrich
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    # e.g. ostrich_1.2.3_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Without these, tar headers carry the uid/gid *and user name* of whoever
    # ran the build.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: docs/USAGE.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  # `git` reads the local history and never looks up authors. `github` would
  # append "(@handle)" to every line.
  use: git
  abbrev: 7
  # Pinned so a future GoReleaser default can't start adding author fields
  # ({{ .AuthorName }}, {{ .AuthorEmail }}, {{ .AuthorUsername }}).
  format: "{{ .SHA }}: {{ .Message }}"
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "(?i)typo"
  groups:
    - title: Features
      regexp: '^.*?feat(ure)?(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: pzindyaev
    name: ostrich
  # Pre-release tags such as v1.2.3-rc1 are marked as pre-releases on GitHub.
  prerelease: auto
  draft: false
  # If the release already exists (e.g. a workflow re-run), keep its name and
  # notes so hand-edited release notes are never overwritten.
  mode: keep-existing
